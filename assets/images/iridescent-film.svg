<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" preserveAspectRatio="xMidYMid slice">
<!-- Brushed-metal interference film, generated.
     Same physics as a soap film - reflectance goes as sin^2(2*pi*n*d /
     lambda), and R/G/B (612/549/464nm) complete different numbers of
     cycles as thickness sweeps, which is what gives real metal its
     coloured sheen rather than a flat grey.
     Two changes from the soap-bubble version: the turbulence is strongly
     anisotropic (0.00055 x 0.0065) so the thickness field forms streaks
     rather than blobs - that is the brushed grain; and saturation is
     pulled to 0.22 so the surface reads as metal with a sheen instead of
     as a bubble. The final feColorMatrix damps the magenta orders. -->
<filter id="le-film" filterUnits="userSpaceOnUse" x="0" y="0" width="1400" height="1000" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.00055 0.0065" numOctaves="4" seed="11" result="t"/>
<feColorMatrix in="t" type="matrix" values="0.34 0.34 0.34 0 0  0.34 0.34 0.34 0 0  0.34 0.34 0.34 0 0  0 0 0 0 1" result="g"/>
<feComponentTransfer in="g" result="d"><feFuncR type="linear" slope="3.6" intercept="-1.3"/><feFuncG type="linear" slope="3.6" intercept="-1.3"/><feFuncB type="linear" slope="3.6" intercept="-1.3"/></feComponentTransfer>
