<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" preserveAspectRatio="xMidYMid slice">
<!-- Brushed-metal interference film, generated.
     Thin-film physics: reflectance goes as sin^2(2*pi*n*d / lambda), and
     R/G/B (612/549/464nm) complete different numbers of cycles as the
     thickness field sweeps. That beat is what gives metal a coloured
     sheen instead of a flat grey.
     Tuned for metal rather than soap film: the turbulence is extremely
     anisotropic (0.0009 x 0.030), so the thickness field forms fine
     streaks - the brushed grain - and that frequency is set high on
     purpose, because the layer is magnified roughly 2.3x by background
     cover plus the -28% inset on the ::before. Saturation is held at
     0.16 and the feColorMatrix damps magenta hard, so the surface reads
     as brushed aluminium catching light rather than as holographic. -->
<filter id="le-film" filterUnits="userSpaceOnUse" x="0" y="0" width="1400" height="1000" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.0009 0.030" numOctaves="3" seed="11" result="t"/>
<feColorMatrix in="t" type="matrix" values="0.34 0.34 0.34 0 0  0.34 0.34 0.34 0 0  0.34 0.34 0.34 0 0  0 0 0 0 1" result="g"/>
<feComponentTransfer in="g" result="d"><feFuncR type="linear" slope="3.4" intercept="-1.2"/><feFuncG type="linear" slope="3.4" intercept="-1.2"/><feFuncB type="linear" slope="3.4" intercept="-1.2"/></feComponentTransfer>
