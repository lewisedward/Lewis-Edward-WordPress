<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" preserveAspectRatio="xMidYMid slice">
<!-- Thin-film interference, generated.
     Reflectance of a soap/oil film at normal incidence goes as
     sin^2(2*pi*n*d / lambda). R, G and B have different wavelengths
     (612/549/464nm), so as the thickness field d sweeps they complete
     DIFFERENT numbers of cycles. The beat between those three
     different-period sinusoids is what gives a real film its
     gold/magenta/cyan/green ordering; a rainbow gradient only
     phase-shifts one period, which is why it reads as a gradient.
     feTurbulence supplies the thickness field; the per-channel
     feFuncX tables are that sin^2 curve sampled 160 times; the final
     feColorMatrix bleeds green into red to damp the magenta orders,
     keeping the film on the lime -> cyan -> violet arc of the brand. -->
<filter id="le-film" filterUnits="userSpaceOnUse" x="0" y="0" width="1400" height="1000" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.0009 0.0017" numOctaves="3" seed="11" result="t"/>
<feColorMatrix in="t" type="matrix" values="0.34 0.34 0.34 0 0  0.34 0.34 0.34 0 0  0.34 0.34 0.34 0 0  0 0 0 0 1" result="g"/>
<feComponentTransfer in="g" result="d"><feFuncR type="linear" slope="3.1" intercept="-1.05"/><feFuncG type="linear" slope="3.1" intercept="-1.05"/><feFuncB type="linear" slope="3.1" intercept="-1.05"/></feComponentTransfer>
